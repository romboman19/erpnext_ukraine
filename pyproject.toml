[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ukrainian_integrations"
version = "0.1.0"
description = "External service connectors for ERPNext Ukraine: delivery, banks, payments, marketplaces, PBX and SMS"
requires-python = ">=3.11"
readme = "README.md"

[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
include = ["ukrainian_integrations*"]
exclude = ["public*", "docs*", "tests*"]

[tool.black]
line-length = 120
