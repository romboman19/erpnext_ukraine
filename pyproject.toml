[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ukrainian_integrations"
version = "0.6.1"
description = "ERPNext Ukrainian Integrations"
requires-python = ">=3.11"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "HUNTER.rv", email = "it@hunter.rv.ua" }]
dependencies = ["defusedxml>=0.7.1,<1", "paramiko>=3.5.1,<6", "requests>=2.33,<3"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]

[project.urls]
Repository = "https://github.com/romboman19/erpnext_ukraine_integrations"
Issues = "https://github.com/romboman19/erpnext_ukraine_integrations/issues"

[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
include = ["ukrainian_integrations*"]
exclude = ["public*", "docs*", "tests*", "ukrainian_integrations.tests*"]

[tool.setuptools.package-data]
ukrainian_integrations = [
    "**/*.json",
    "**/*.js",
    "public/images/*.svg",
    "public/js/*.js",
    "public/js/**/*.js",
    "translations/*.csv",
    "modules.txt",
    "patches.txt",
]

[tool.black]
line-length = 120

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]
ignore = ["E501"]
