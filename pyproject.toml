[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "erpnext_consignment_and_commission"
version = "1.1.0"
description = "Commission and consignment trade for Frappe and ERPNext"
requires-python = ">=3.14"
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "HUNTER.rv", email = "it@hunter.rv.ua" }]

[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
include = ["erpnext_consignment_and_commission*"]

[tool.ruff]
line-length = 120
target-version = "py314"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
