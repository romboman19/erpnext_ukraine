name: CI

on:
  push:
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  static-and-package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.14"
      - uses: actions/setup-node@v6
        with:
          node-version: "24"

      - name: Install package and test tools
        run: python -m pip install --disable-pip-version-check -e . ruff pytest build pip-audit

      - name: Validate source and metadata
        run: |
          python -m compileall -q erpnext_ua
          find erpnext_ua -name '*.json' -print0 | xargs -0 -n1 jq -e . >/dev/null
          find deployment -name '*.json' -print0 | xargs -0 -n1 jq -e . >/dev/null
          find erpnext_ua -name '*.js' -print0 | xargs -0 -n1 node --check
          python tools/validate_production_image.py \
            --source-root . \
            --contract deployment/production/image-contract.json
          git diff --check

      - name: Lint linted trees
        run: ruff check

      - name: Dependency vulnerability audit
        run: pip-audit --strict --progress-spinner off .

      - name: Verify hook targets resolve
        run: python tools/check_hooks.py

      - name: Run framework-independent tests
        run: |
          python -m unittest discover -s erpnext_ua/tests -p "test*.py"
          pytest -q erpnext_ua/consignment_and_commission/tests erpnext_ua/group_stock_fifo/tests

      - name: Build and inspect distributable app
        run: |
          python -m build
          python - <<'PY'
          import glob
          import zipfile

          wheel = glob.glob("dist/*.whl")[0]
          names = set(zipfile.ZipFile(wheel).namelist())
          required_suffixes = {
              "doctype/gsf_warehouse_binding/gsf_warehouse_binding.json",
              "doctype/ua_gift_certificate/ua_gift_certificate.json",
              "doctype/ua_loyalty_account/ua_loyalty_account.json",
              "doctype/np_sender_profile/np_sender_profile.json",
              "doctype/up_sender_profile/up_sender_profile.json",
              "chart_of_accounts/ua_full_291.json",
              "chart_of_accounts/ua_simplified_186.json",
              "doctype/ua_off_balance_entry/ua_off_balance_entry.json",
              "doctype/cc_stock_lot/cc_stock_lot.json",
              "report/ua_off_balance_statement/ua_off_balance_statement.json",
              "translations/uk.csv",
          }
          missing = sorted(suffix for suffix in required_suffixes if not any(name.endswith(suffix) for name in names))
          if missing:
              raise SystemExit(f"Wheel is missing package data: {missing}")
          assert sum(name.endswith(".xsd") for name in names) == 3, "PRRO schemas are missing from the wheel"
          PY

  frappe-integration:
    name: ERPNext v16 clean install and migrate
    needs: static-and-package
    runs-on: ubuntu-latest
    timeout-minutes: 45
    container:
      image: frappe/erpnext:v16.26.2
      options: --user root
    services:
      mariadb:
        image: mariadb:10.6
        env:
          MARIADB_ROOT_PASSWORD: admin
          MARIADB_ROOT_HOST: "%"
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=15
      redis:
        image: redis:6.2-alpine
        options: >-
          --health-cmd="redis-cli ping"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
    steps:
      - uses: actions/checkout@v6
      - name: Install the app on a clean ERPNext site
        run: tools/ci_frappe_integration.sh
