name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  quality:
    name: Static quality and unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Install quality tooling
        run: python -m pip install --upgrade pip build==1.3.0 requests ruff==0.12.7 bandit==1.8.6 pip-audit==2.10.1
      - name: Install app and runtime dependencies
        run: python -m pip install -e .
      - name: Compile Python
        run: python -m compileall -q ukrainian_integrations
      - name: Lint Python
        run: ruff check ukrainian_integrations
      - name: Security scan
        run: bandit -q -r ukrainian_integrations -x ukrainian_integrations/tests
      - name: Dependency vulnerability audit
        run: pip-audit --strict --progress-spinner off .
      - name: Unit and contract tests
        run: python -m unittest discover -s ukrainian_integrations/tests -p "test*.py" -v
      - name: Validate JavaScript syntax
        run: find ukrainian_integrations/public -name "*.js" -print0 | xargs -0 -n1 node --check
      - name: Build distribution
        run: python -m build

  frappe-integration:
    name: ERPNext v16 install and migrate
    needs: quality
    runs-on: ubuntu-latest
    timeout-minutes: 35
    container:
      image: frappe/erpnext:v16.26.2
      options: --user root
    services:
      mariadb:
        image: mariadb:10.6
        env:
          MARIADB_ROOT_PASSWORD: admin
          MARIADB_ROOT_HOST: "%"
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=15
      redis:
        image: redis:6.2-alpine
        options: >-
          --health-cmd="redis-cli ping"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
    steps:
      - uses: actions/checkout@v4
      - name: Install app on a clean ERPNext site
        run: scripts/ci_frappe_integration.sh
