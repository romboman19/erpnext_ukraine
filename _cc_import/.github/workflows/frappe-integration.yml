name: Frappe Integration

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  clean-site:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    services:
      mariadb:
        image: mariadb:10.6
        env:
          MARIADB_ROOT_PASSWORD: root
        ports:
          - 3306:3306
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20
      redis:
        image: redis:7.4-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd="redis-cli ping"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20

    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.14"
      - uses: actions/setup-node@v6
        with:
          node-version: "24"
      - name: Install system and bench dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y mariadb-client libmariadb-dev pkg-config
          corepack enable
          corepack prepare yarn@1.22.22 --activate
          python -m pip install frappe-bench
      - name: Initialize Frappe v16 bench
        run: >-
          bench init
          --skip-assets
          --skip-redis-config-generation
          --frappe-branch version-16
          --python "$(command -v python)"
          frappe-bench
      - name: Install integration test reporter
        working-directory: frappe-bench
        run: bench pip install unittest-xml-reporting
      - name: Install ERPNext and the application source
        working-directory: frappe-bench
        run: |
          bench get-app --skip-assets --branch version-16 erpnext https://github.com/frappe/erpnext
          bench get-app --skip-assets erpnext_ua https://github.com/romboman19/erpnext_ukraine
          bench get-app --skip-assets erpnext_consignment_and_commission "$GITHUB_WORKSPACE"
          bench set-config -g redis_cache redis://127.0.0.1:6379
          bench set-config -g redis_queue redis://127.0.0.1:6379
          bench set-config -g redis_socketio redis://127.0.0.1:6379
      - name: Create clean site and install applications
        working-directory: frappe-bench
        run: |
          bench new-site integration.local \
            --db-host 127.0.0.1 \
            --db-port 3306 \
            --mariadb-root-password root \
            --admin-password admin \
            --no-mariadb-socket
          bench --site integration.local install-app erpnext
          bench --site integration.local install-app erpnext_ua
          bench --site integration.local install-app erpnext_consignment_and_commission
          bench --site integration.local set-config allow_tests true
      - name: Run application integration tests
        working-directory: frappe-bench
        run: >-
          bench --site integration.local run-tests
          --app erpnext_consignment_and_commission
          --test-category integration
          --junit-xml-output integration-test-results.xml
      - name: Upload integration test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: frappe-integration-results
          path: frappe-bench/integration-test-results.xml
          if-no-files-found: ignore
