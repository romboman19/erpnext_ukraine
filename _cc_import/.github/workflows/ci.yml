name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  isolated-python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.14"
          cache: pip
      - name: Install package and test tools
        run: python -m pip install -e . ruff pytest
      - name: Lint
        run: ruff check .
      - name: Compile
        run: python -m compileall -q erpnext_consignment_and_commission
      - name: Unit tests
        run: pytest -q erpnext_consignment_and_commission/consignment_and_commission/tests
